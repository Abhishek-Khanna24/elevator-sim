[project]
name = "elevator-sim"
version = "0.1.0"
description = "Discrete-time Destination Dispatch elevator system simulator"
readme = "README.md"
authors = [
    { name = "Abhishek Khanna", email = "abhishek241194@gmail.com" }
]
requires-python = ">=3.14"
dependencies = []

[project.scripts]
elevator-sim = "elevator_sim.cli:main"

[build-system]
requires = ["uv_build>=0.13.3,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.5",
    "mypy>=2.4.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "C4", "PT"]
ignore = ["PLR0913", "PLR2004", "PLR0912", "PLR0911"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
